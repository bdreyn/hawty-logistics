backend:
  name: github
  repo: bdreyn/hawty-logistics
  branch: main

media_folder: src/assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage Sections
        file: src/_data/homepage.json
        fields:
          - label: Sections
            name: sections
            widget: list
            summary: "{{fields.type}} — {{fields.heading}}"
            types:
              - label: Hero
                name: hero
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: hero }
                  - { label: Visible, name: visible, widget: boolean, default: true }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Button Text, name: ctaText, widget: string, required: false }
                  - { label: Button Link, name: ctaLink, widget: string, required: false }
              - label: About
                name: about
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: about }
                  - { label: Visible, name: visible, widget: boolean, default: true }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Body, name: body, widget: text }
              - label: Services
                name: services
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: services }
                  - { label: Visible, name: visible, widget: boolean, default: true }
                  - { label: Heading, name: heading, widget: string }
              - label: Testimonials
                name: testimonials
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: testimonials }
                  - { label: Visible, name: visible, widget: boolean, default: true }
                  - { label: Heading, name: heading, widget: string }
              - label: Contact
                name: contact
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: contact }
                  - { label: Visible, name: visible, widget: boolean, default: true }
                  - { label: Heading, name: heading, widget: string }

  - name: site
    label: Site Settings
    files:
      - name: site
        label: Company Info
        file: src/_data/site.json
        fields:
          - { label: Company Name, name: companyName, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Phone, name: phone, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Address, name: address, widget: string }
          - label: Social Links
            name: social
            widget: object
            fields:
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: Twitter, name: twitter, widget: string, required: false }
          - { label: Logo, name: logo, widget: image, required: false }

  - name: services
    label: Services
    folder: src/services
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Order, name: order, widget: number, default: 1 }
      - { label: Icon, name: icon, widget: image, required: false }
      - { label: Summary, name: summary, widget: string }
      - { label: Body, name: body, widget: markdown }

  - name: testimonials
    label: Testimonials
    folder: src/testimonials
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Client Name, name: name, widget: string }
      - { label: Company, name: company, widget: string, required: false }
      - { label: Order, name: order, widget: number, default: 1 }
      - { label: Photo, name: photo, widget: image, required: false }
      - { label: Quote, name: body, widget: markdown }
