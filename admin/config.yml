backend:
  name: github
  repo: bdreyn/hawty-logistics
  branch: develop
  base_url: https://sveltia-cms-auth.bdreyn.workers.dev

site_url: https://hawty-logistics-preview.pages.dev

media_folder: src/assets/img
public_folder: /assets/img

collections:
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage Sections
        file: src/_data/homepage.json
        fields:
          - label: Sections
            name: sections
            widget: list
            summary: "{{fields.type}} — {{fields.heading}}"
            types:
              - label: Hero
                name: hero
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: hero }
                  - { label: Visible, name: visible, widget: boolean, default: true }
                  - { label: Headline, name: headline, widget: string }
                  - { label: Subtext, name: subtext, widget: text }
                  - { label: Button Label, name: ctaLabel, widget: string }
                  - { label: Button Link, name: ctaLink, widget: string, default: "#contact" }
              - label: About
                name: about
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: about }
                  - { label: Visible, name: visible, widget: boolean, default: true }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Body, name: body, widget: text }
              - label: Services
                name: services
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: services }
                  - { label: Visible, name: visible, widget: boolean, default: true }
                  - { label: Heading, name: heading, widget: string }
                  - label: Service Items
                    name: items
                    widget: list
                    fields:
                      - { label: Title, name: title, widget: string }
                      - { label: Description, name: description, widget: text }
              - label: Contact
                name: contact
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: contact }
                  - { label: Visible, name: visible, widget: boolean, default: true }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Email, name: email, widget: string, required: false }
                  - { label: Phone, name: phone, widget: string, required: false }

  - name: site
    label: Site Settings
    files:
      - name: site
        label: Company Info
        file: src/_data/site.json
        fields:
          - { label: Company Name, name: companyName, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Logo, name: logo, widget: image }
          - { label: Favicon, name: favicon, widget: file }

  - name: pages
    label: Pages
    folder: src/pages
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Order, name: order, widget: number, default: 1 }
      - { label: Body, name: body, widget: markdown }
